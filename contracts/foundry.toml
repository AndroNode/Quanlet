[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.30"
# Robinhood Chain runs Arbitrum Nitro; Cancun (MCOPY) is the newest target we assume until the
# Gate B spike confirms more. The verifier only needs MCOPY.
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
# One compiler profile for every contract, so each build is reproducible. Robinhood Chain (testnet and
# mainnet) allows contracts up to 98,304 bytes, so PersonalVaultV2 (26,712 bytes) needs no size build.
# Tests sign with real ML-DSA-44 keys through node (test/ffi) and build key blobs with script/prepare.py.
ffi = true
fs_permissions = [{ access = "read", path = "./helpers" }, { access = "read", path = "./test/acvp" }, { access = "read", path = "../cli" }, { access = "write", path = "./deployments/gas-foundry.json" }, { access = "write", path = "./deployments/gas-foundry-v2.json" }]

[profile.default.fuzz]
runs = 64

[profile.ci.fuzz]
runs = 256

[profile.deploy]
fs_permissions = [{ access = "read", path = "./helpers" }, { access = "read", path = "./test/acvp" }, { access = "read-write", path = "./deployments" }]

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"

[lint]
# Timelocks are measured in chain timestamps by design (whitepaper section 3).
exclude_lints = ["block-timestamp"]
