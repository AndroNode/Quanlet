    <script>
      // Apply motion preference before first paint (FR-07).
      try {
        var m = localStorage.getItem('quanlet.motion');
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.documentElement.dataset.motion = m ? m : reduce ? 'off' : 'on';
      } catch (e) { document.documentElement.dataset.motion = 'on'; }
    </script>
